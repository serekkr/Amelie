<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amelie Canvas</title>
  <link rel="stylesheet" href="excalidraw-bundle.css"/>
  <link rel="stylesheet" href="fonts.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
    /* tick canvas: keeps compositor layer dirty every frame */
    #__compositor_tick__ {
      position: fixed; top: 0; left: 0; width: 1px; height: 1px;
      opacity: 0.004; pointer-events: none; z-index: -1;
    }
  </style>
  <script>
    // MUST run before the bundle: Excalidraw reads this at module init to find
    // its fonts. Without it the fonts are fetched from a CDN, which the app's
    // CSP blocks — so the canvas would lose its lettering when offline.
    window.EXCALIDRAW_ASSET_PATH = './excalidraw-assets/';
  </script>
</head>
<body>
  <canvas id="__compositor_tick__" width="2" height="2"></canvas>
  <div id="root"></div>
  <script src="excalidraw-bundle.js"></script>
  <script>
    const {
      React, ReactDOM, Excalidraw,
      serializeAsJSON, restore, convertToExcalidrawElements,
    } = window.__ExcalidrawLib;
    const { createElement: h } = React;

    let api = null;              // ExcalidrawImperativeAPI
    let pendingLoad = null;
    let suppressChange = 0;      // >0 while WE are loading a scene, so the
                                 // resulting onChange isn't reported as a user edit
    const post = (msg) => window.parent.postMessage(msg, '*');

    // ── File format ──────────────────────────────────────────────────────────
    // .draw now holds an Excalidraw scene: { type: "excalidraw", elements, appState, files }.
    // Files written by the previous tldraw-based canvas look like { store, schema }
    // — those can't be read here, and blanking them silently would destroy the
    // drawing, so they're refused and reported instead.
    const isTldrawFile = (o) => !!o && typeof o === 'object' && !Array.isArray(o)
      && ('store' in o) && ('schema' in o);

    function loadData(json) {
      if (!api || !json) return;
      let scene;
      try {
        scene = JSON.parse(json);
      } catch (e) {
        console.error('[canvas] .draw is not valid JSON', e);
        post({ type: 'CANVAS_LOAD_ERROR', reason: 'invalid-json' });
        return;
      }
      if (isTldrawFile(scene)) {
        console.error('[canvas] this .draw was written by the old tldraw canvas and cannot be opened');
        post({ type: 'CANVAS_LOAD_ERROR', reason: 'legacy-tldraw' });
        return;
      }
      try {
        // `restore` fills in defaults and migrates older Excalidraw scenes.
        const data = restore(scene && typeof scene === 'object' ? scene : {}, null, null);
        suppressChange++;
        api.updateScene({ elements: data.elements || [] });
        if (data.files && Object.keys(data.files).length) api.addFiles(Object.values(data.files));
        // Release the guard after React has flushed the resulting onChange.
        setTimeout(() => { suppressChange = Math.max(0, suppressChange - 1); }, 0);
      } catch (e) {
        suppressChange = Math.max(0, suppressChange - 1);
        console.error('[canvas] load failed', e);
        post({ type: 'CANVAS_LOAD_ERROR', reason: 'restore-failed' });
      }
    }

    function App() {
      return h(Excalidraw, {
        theme: 'dark',
        langCode: 'it',
        excalidrawAPI: (a) => {
          api = a;
          post({ type: 'CANVAS_READY' });
          if (pendingLoad) { loadData(pendingLoad); pendingLoad = null; }
        },
        // Excalidraw's dark theme INVERTS the canvas, so viewBackgroundColor is
        // given in light-theme terms: white here renders as the dark canvas that
        // matches the rest of Amelie. Setting a dark value would inverted into a
        // light grey sheet — which is exactly what it did.
        initialData: { appState: { viewBackgroundColor: '#ffffff', currentItemFontFamily: 3 } },
        // Every scene mutation lands here. NOT wrapped in a silent try/catch: a
        // throw means edits stop reaching the parent and the drawing is not being
        // saved, which has to be visible.
        onChange: (elements, appState, files) => {
          if (suppressChange > 0) return;
          try {
            const json = serializeAsJSON(elements, appState, files || {}, 'local');
            post({ type: 'CANVAS_CHANGE', json });
          } catch (e) { console.error('[canvas] serialize failed', e); }
        },
      });
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));

    window.addEventListener('message', (e) => {
      const msg = e.data;

      if (msg?.type === 'LOAD_DATA' && msg.json) {
        if (api) loadData(msg.json);
        else pendingLoad = msg.json;
        return;
      }

      if (!api) return;

      if (msg?.type === 'ADD_NOTE') {
        const { label, snippet, tags } = msg;
        const titleText = label || 'Nota';
        const bodyText  = snippet ? snippet.slice(0, 120) : '';
        const tagsText  = tags?.length ? tags.map(t => '#' + t).join('  ') : '';
        const text = titleText + (bodyText ? '\n\n' + bodyText : '') + (tagsText ? '\n\n' + tagsText : '');
        const x = 100 + Math.random() * 300;
        const y = 100 + Math.random() * 200;
        // A rectangle with bound text is Excalidraw's sticky note: it keeps the
        // text inside the box and resizes with it.
        const added = convertToExcalidrawElements([{
          type: 'rectangle', x, y, width: 260, height: 160,
          backgroundColor: '#a5d8ff', fillStyle: 'solid', strokeColor: '#1e1e1e',
          label: { text, fontSize: 16, textAlign: 'left', verticalAlign: 'top' },
        }]);
        api.updateScene({ elements: [...api.getSceneElements(), ...added] });
      }

      if (msg?.type === 'SAVE_REQUEST') {
        post({ type: 'SAVED' });
      }
    });
  </script>
  <script>
    // Keep the iframe compositor layer dirty every frame so the software
    // compositor always re-reads the canvas content instead of a stale frame.
    (function() {
      const tc = document.getElementById('__compositor_tick__');
      const ctx = tc.getContext('2d');
      let t = 0;
      function tick() {
        const v = (t++ & 1) ? 22 : 23;
        ctx.fillStyle = 'rgb(22,27,' + v + ')';
        ctx.fillRect(0, 0, 2, 2);
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
