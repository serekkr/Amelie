name: "Amelie CodeQL config"

# Skip third-party / generated JavaScript. These are not our source:
#   - src/renderer/vendor/cm.bundle.js is generated by `npm run build:cm`
#     (esbuild) from build/cm-entry.js — fix the source, not the bundle.
#   - *.min.js are minified vendored libraries (highlight.js, marked, DOMPurify).
paths-ignore:
  - "src/renderer/vendor/**"
  - "**/*.min.js"
